[package]
name = "xcraw"
version = "0.1.0"
edition = "2024"

[dependencies]
# serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# runtime
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
axum = { version = "0.8.8", features = ["http2", "macros", "multipart", "ws"] }
tokio-cron-scheduler = { version = "0.15.1", features = ["bytes", "log"] }
futures = { version = "0.3.32", features = ["spin"] }
anyhow = { version = "1.0.102", features = ["backtrace"] }


# orm
diesel = { version = "2.3.6", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }

# ai sdk
rig-core = { version = "0.31.0", features = ["all"] }

# channel integration
serenity = "0.12.5"

# log
log = "0.4.29"
env_logger = "0.11"
logforth = { version = "0.29.1", features = ["starter-log"] }
fastrace-axum = "0.2.0"

# other utilities
regex = "1.11"
dotenv = "0.15"
async-trait = "0.1"
